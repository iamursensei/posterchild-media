# Supabase CLI project configuration.
#
# Created manually. The Supabase CLI is not installed in this environment,
# so this file was NOT generated by `supabase init` -- it was written by
# hand, deliberately minimal, specifically to avoid any risk of `init`
# overwriting, renaming, or otherwise disturbing the already-live migration
# files under supabase/migrations/ (001_foundation_catalog.sql and
# 002_scheduling_bookings.sql). Nothing in this file references or affects
# migrations in any way.
#
# project_id here is NOT a remote project reference -- it is purely a
# local-host namespace string the CLI uses to name its own Docker
# containers/network/volumes so multiple local Supabase projects on one
# machine don't collide (confirmed against the CLI's own generated
# config.toml: "A string used to distinguish different Supabase projects
# on the same host"). It has no relationship to which remote project a
# future `supabase link --project-ref <your-project-ref>` would target --
# that remains a separate, deliberate step, not yet taken.
project_id = "posterchild-media-local"

# Stage 1 function: intentionally public, no Supabase auth token required.
# The current static frontend has no Supabase client/JWT of any kind, and
# this function reads no client-specific data and performs no write of its
# own -- access control for it is the explicit CORS origin allowlist in
# supabase/functions/_shared/cors.ts, not a Supabase-issued credential.
[functions.availability]
verify_jwt = false

# Stage 2 function: same public/no-JWT model as availability, for the
# same reason (no Supabase client/JWT exists on the frontend yet).
# UNLIKE availability, this function WRITES (creates holds + resource
# reservations) and consumes a scarce, exclusive resource pool -- it
# must not be deployed to public production without a real rate-limiting
# mechanism in front of it (see supabase/functions/hold/index.ts). This
# config entry exists for local completeness only; no deploy has
# happened as part of this pass.
[functions.hold]
verify_jwt = false
